<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Gestion des utilisateurs — Belsentes</title>
<style>
  :root{ --ink:#1a2b1f; --line:#2f6b3a; --paper:#f4f1ea; --panel:#ffffff; --muted:#5c6b5f; --danger:#a1352b; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);}
  #topbar{
    position:sticky;top:0;z-index:100;background:var(--panel);border-bottom:3px solid var(--ink);
    padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  #topbar h1{font-size:16px;margin:0;}
  #topbar a{color:var(--ink);text-decoration:none;font-size:13px;border:2px solid var(--ink);border-radius:8px;padding:6px 10px;}
  #topbar a:hover{background:var(--ink);color:var(--paper);}
  #main{padding:16px;max-width:700px;margin:0 auto;}
  .card{background:var(--panel);border:2px solid var(--ink);border-radius:12px;padding:16px 18px;margin-bottom:16px;}
  .card h2{font-size:15px;margin:0 0 10px;}
  .card p.hint{font-size:12px;color:var(--muted);margin-top:-6px;margin-bottom:12px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px;}
  .field input{width:100%;font-size:15px;padding:10px 12px;border:2px solid #ccc;border-radius:8px;font-family:inherit;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .btn{font-size:14px;padding:10px 14px;border:2px solid var(--ink);border-radius:8px;background:var(--panel);cursor:pointer;font-weight:700;color:var(--ink);width:100%;}
  .btn.primary{background:var(--line);color:#fff;border-color:var(--line);}
  .btn.danger{background:#f6dedb;border-color:var(--danger);color:var(--danger);width:auto;padding:6px 10px;font-size:12px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .user-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 12px;border:2px solid #ddd;border-radius:10px;margin-bottom:8px;font-size:14px;
  }
  .role-tag{font-size:10px;background:#e4f0e2;color:var(--line);padding:2px 8px;border-radius:12px;font-weight:700;margin-left:6px;}
  #msg{font-size:13px;text-align:center;min-height:18px;margin-top:8px;font-weight:700;}
  #loginGate{
    position:fixed;inset:0;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;text-align:center;padding:30px;z-index:2000;
  }
  #loginGate.hidden{display:none;}
  #loginGate a{color:#fff;background:var(--line);padding:10px 18px;border-radius:8px;text-decoration:none;font-weight:700;}
  #adminOnly.hidden{display:none;}
</style>
</head>
<body>

<div id="loginGate">
  <h2>👤 Gestion des utilisateurs</h2>
  <p>Vous devez être connecté(e) sur l'appli principale pour accéder à cette page.</p>
  <a href="index.html">Aller me connecter</a>
</div>

<div id="topbar">
  <h1>👤 Gestion des utilisateurs</h1>
  <a href="index.html">← Retour à la carte</a>
</div>

<div id="main">
  <div class="card">
    <h2>Comptes existants</h2>
    <div id="userList"><p style="color:var(--muted);font-size:13px;">Chargement…</p></div>
  </div>

  <div id="adminOnly">
    <div class="card">
      <h2>Créer un utilisateur</h2>
      <p class="hint">Réservé aux administrateurs.</p>
      <div class="row2">
        <div class="field"><label>Prénom</label><input type="text" id="newFirstName" placeholder="Prénom"></div>
        <div class="field"><label>Nom</label><input type="text" id="newLastName" placeholder="Nom"></div>
      </div>
      <div class="field"><label>Identifiant de connexion</label><input type="text" id="newUsername" placeholder="ex: jdupont"></div>
      <div class="field"><label>Mot de passe initial</label><input type="password" id="newPass" placeholder="mot de passe temporaire" autocomplete="new-password"></div>
      <div class="field">
        <label style="display:flex;align-items:center;gap:8px;font-weight:400;">
          <input type="checkbox" id="newIsAdmin" style="width:auto;"> Compte administrateur
        </label>
      </div>
      <button class="btn primary" id="btnCreate">Créer l'utilisateur</button>
      <div id="msg"></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var CONFIG = { WORKER_URL: "https://ambroisie-belsentes-api.clement-thieuleux.workers.dev/signalements" };

  var sessionToken = localStorage.getItem('ambroisie_token');
  var currentUser = localStorage.getItem('ambroisie_user');
  var currentRole = localStorage.getItem('ambroisie_role');

  if(!sessionToken || !currentUser){
    document.getElementById('loginGate').classList.remove('hidden');
  } else {
    document.getElementById('loginGate').classList.add('hidden');
  }
  if(currentRole === 'admin') document.getElementById('adminOnly').classList.remove('hidden');

  function authHeaders(extra){
    var h = { 'Authorization': 'Bearer ' + sessionToken };
    if(extra) Object.assign(h, extra);
    return h;
  }
  function usersApiUrl(){ return CONFIG.WORKER_URL.replace('/signalements', '/users'); }
  function escapeHtml(str){
    var div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  var users = [];

  async function loadUsers(){
    try{
      var resp = await fetch(usersApiUrl(), { method: 'GET', headers: authHeaders() });
      if(resp.status === 401){ document.getElementById('loginGate').classList.remove('hidden'); return; }
      if(!resp.ok) throw new Error('HTTP ' + resp.status);
      var data = await resp.json();
      users = data.items || [];
      renderUsers();
    } catch(e){
      document.getElementById('userList').innerHTML = '<p style="color:var(--danger);font-size:13px;">Erreur de chargement.</p>';
    }
  }

  function renderUsers(){
    var box = document.getElementById('userList');
    box.innerHTML = users.map(function(u){
      var fullName = ((u.firstName||'') + ' ' + (u.lastName||'')).trim() || u.username;
      var canDelete = currentRole === 'admin' && u.username !== currentUser &&
        !(u.role === 'admin' && users.filter(function(x){return x.role==='admin';}).length <= 1);
      return '<div class="user-row">' +
        '<span>' + escapeHtml(fullName) + ' (' + escapeHtml(u.username) + ')' +
          '<span class="role-tag">' + (u.role === 'admin' ? 'Admin' : 'Conseiller') + '</span>' +
        '</span>' +
        (canDelete ? '<button class="btn danger" data-del="' + escapeHtml(u.username) + '">Supprimer</button>' : '') +
      '</div>';
    }).join('') || '<p style="color:var(--muted);font-size:13px;">Aucun utilisateur.</p>';

    box.querySelectorAll('[data-del]').forEach(function(btn){
      btn.addEventListener('click', async function(){
        var uname = btn.getAttribute('data-del');
        if(!confirm('Supprimer l\'utilisateur ' + uname + ' ?')) return;
        try{
          var resp = await fetch(usersApiUrl(), {
            method: 'DELETE',
            headers: authHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify({ username: uname })
          });
          if(!resp.ok) throw new Error('Erreur');
          await loadUsers();
        } catch(e){ alert('Erreur lors de la suppression.'); }
      });
    });
  }

  document.getElementById('btnCreate').addEventListener('click', async function(){
    var firstName = document.getElementById('newFirstName').value.trim();
    var lastName = document.getElementById('newLastName').value.trim();
    var username = document.getElementById('newUsername').value.trim();
    var pass = document.getElementById('newPass').value;
    var isAdmin = document.getElementById('newIsAdmin').checked;
    var msg = document.getElementById('msg');
    msg.style.color = '';
    if(!firstName || !lastName || !username || !pass){
      msg.style.color = 'var(--danger)'; msg.textContent = 'Tous les champs sont requis.'; return;
    }
    if(pass.length < 4){
      msg.style.color = 'var(--danger)'; msg.textContent = 'Mot de passe trop court (4 caractères min).'; return;
    }
    var btn = document.getElementById('btnCreate');
    btn.disabled = true; btn.textContent = 'Création…';
    try{
      var resp = await fetch(usersApiUrl(), {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ username: username, password: pass, firstName: firstName, lastName: lastName, role: isAdmin ? 'admin' : 'user' })
      });
      var data = await resp.json();
      if(!resp.ok){ throw new Error(data.error || 'Erreur'); }
      document.getElementById('newFirstName').value = '';
      document.getElementById('newLastName').value = '';
      document.getElementById('newUsername').value = '';
      document.getElementById('newPass').value = '';
      document.getElementById('newIsAdmin').checked = false;
      msg.style.color = 'var(--line)';
      msg.textContent = '✓ Utilisateur créé.';
      await loadUsers();
    } catch(e){
      msg.style.color = 'var(--danger)';
      msg.textContent = e.message || 'Erreur lors de la création.';
    } finally {
      btn.disabled = false; btn.textContent = 'Créer l\'utilisateur';
    }
  });

  if(sessionToken && currentUser) loadUsers();
})();
</script>
</body>
</html>
