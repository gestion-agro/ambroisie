<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>État des routes — Belsentes</title>
<style>
  :root{ --ink:#1a2b1f; --line:#2f6b3a; --paper:#f4f1ea; --panel:#ffffff; --muted:#5c6b5f; --danger:#a1352b; --amber:#c9781f; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);}
  #topbar{
    position:sticky;top:0;z-index:100;background:var(--panel);border-bottom:3px solid var(--ink);
    padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  #topbar h1{font-size:16px;margin:0;}
  #topbar a{color:var(--ink);text-decoration:none;font-size:13px;border:2px solid var(--ink);border-radius:8px;padding:6px 10px;}
  #topbar a:hover{background:var(--ink);color:var(--paper);}
  #main{padding:16px;max-width:1200px;margin:0 auto;}
  .card{background:var(--panel);border:2px solid var(--ink);border-radius:12px;padding:14px 16px;margin-bottom:14px;}
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .filters .field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;}
  .filters input, .filters select{font-size:14px;padding:8px 10px;border:2px solid #ccc;border-radius:8px;font-family:inherit;min-width:160px;}
  .filters input[type=text]{min-width:220px;}
  #resultCount{font-size:12px;color:var(--muted);margin-left:auto;align-self:center;}
  table{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);}
  thead th{
    background:#e4e0d4;border-bottom:2px solid var(--ink);
    padding:8px 6px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;
  }
  tbody td{padding:7px 6px;border-bottom:1px solid #ddd;vertical-align:middle;}
  tbody tr:hover{background:#f7f5ee;}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
  .nameCell{display:flex;align-items:center;gap:6px;}
  .nameCell input{
    font-size:13px;padding:5px 8px;border:2px solid #ccc;border-radius:6px;font-family:inherit;flex:1;min-width:140px;
  }
  .nameCell button{font-size:11px;padding:5px 8px;border-radius:6px;border:2px solid var(--line);background:var(--line);color:#fff;cursor:pointer;}
  .nameCell button:disabled{opacity:.4;cursor:not-allowed;}
  .toggleBtn{font-size:11px;padding:6px 10px;border-radius:6px;border:2px solid var(--ink);background:var(--panel);cursor:pointer;font-weight:700;white-space:nowrap;}
  .toggleBtn.done{background:#e4f0e2;border-color:var(--line);color:var(--line);}
  #loginGate{
    position:fixed;inset:0;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;text-align:center;padding:30px;z-index:2000;
  }
  #loginGate.hidden{display:none;}
  #loginGate a{color:#fff;background:var(--line);padding:10px 18px;border-radius:8px;text-decoration:none;font-weight:700;}
  #toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:8px;font-size:13px;z-index:1500;display:none;box-shadow:2px 3px 0 rgba(0,0,0,.3);
  }
  #toast.show{display:block;}
  .btn{font-size:13px;padding:8px 12px;border:2px solid var(--ink);border-radius:8px;background:var(--panel);cursor:pointer;font-weight:700;color:var(--ink);}
  .loadingMsg{padding:30px;text-align:center;color:var(--muted);}
</style>
</head>
<body>

<div id="loginGate">
  <h2>🛣️ État des routes</h2>
  <p>Vous devez être connecté(e) sur l'appli principale pour accéder à cette page.</p>
  <a href="index.html">Aller me connecter</a>
</div>

<div id="topbar">
  <h1>🛣️ État des routes</h1>
  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <a href="classify.html" style="color:var(--ink);text-decoration:none;font-size:13px;border:2px solid var(--ink);border-radius:8px;padding:6px 10px;">🗂️ Classifier route par route</a>
    <button class="btn" id="btnReload">↻ Recharger depuis OpenStreetMap</button>
    <a href="index.html">← Retour à la carte</a>
  </div>
</div>

<div id="main">
  <div class="card filters">
    <div class="field">
      <label>Recherche</label>
      <input type="text" id="fSearch" placeholder="Nom de route...">
    </div>
    <div class="field">
      <label>Type</label>
      <select id="fClass">
        <option value="">Toutes</option>
        <option value="RC">Communale (RC)</option>
        <option value="RD">Départementale (RD)</option>
        <option value="RN">Nationale (RN)</option>
        <option value="PATH">Chemin de terre/privé</option>
      </select>
    </div>
    <div class="field">
      <label>Statut</label>
      <select id="fStatus">
        <option value="">Tous</option>
        <option value="oui">Parcourue</option>
        <option value="non">Non parcourue</option>
      </select>
    </div>
    <div class="field">
      <label>Nom</label>
      <select id="fNamed">
        <option value="">Toutes</option>
        <option value="named">Nommées</option>
        <option value="unnamed">Sans nom (à nommer)</option>
      </select>
    </div>
    <div class="field">
      <label>Visibilité</label>
      <select id="fHidden">
        <option value="non">Masquer les routes cachées</option>
        <option value="tous">Toutes (avec cachées)</option>
        <option value="oui">Cachées seulement</option>
      </select>
    </div>
    <div id="resultCount"></div>
  </div>

  <div class="card" style="padding:0;overflow-x:auto;">
    <div id="loadStatus" class="loadingMsg">Chargement depuis OpenStreetMap…</div>
    <table id="mainTable" style="display:none;">
      <thead>
        <tr>
          <th>Nom de la route</th>
          <th>Type</th>
          <th>Statut</th>
          <th>Par / le</th>
          <th style="width:140px;">Action</th>
          <th style="width:100px;">Visibilité</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  var CONFIG = { WORKER_URL: "https://ambroisie-belsentes-api.clement-thieuleux.workers.dev/signalements" };
  var INSEE_CODE = "07165";
  var BBOX = { south: 44.870, west: 4.410, north: 44.998, east: 4.565 };

  var sessionToken = localStorage.getItem('ambroisie_token');
  var currentUser = localStorage.getItem('ambroisie_user');

  if(!sessionToken || !currentUser){
    document.getElementById('loginGate').classList.remove('hidden');
  } else {
    document.getElementById('loginGate').classList.add('hidden');
  }

  function authHeaders(extra){
    var h = { 'Authorization': 'Bearer ' + sessionToken };
    if(extra) Object.assign(h, extra);
    return h;
  }
  function escapeHtml(str){
    var div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }
  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  // ---- Récupération des routes depuis la BD TOPO de l'IGN ----
  // Relais via le Worker Cloudflare (infrastructure officielle française,
  // indépendante d'OSM/Overpass).
  function fetchFromBdTopo(bbox, onSuccess, onFail, timeoutMs){
    timeoutMs = timeoutMs || 15000;
    var controller = new AbortController();
    var to = setTimeout(function(){ controller.abort(); }, timeoutMs);
    fetch(CONFIG.WORKER_URL.replace('/signalements', '/bdtopo-proxy'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bbox: bbox }),
      signal: controller.signal
    })
    .then(function(r){
      clearTimeout(to);
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(data){
      if(data && data.error) throw new Error(data.error);
      onSuccess(data);
    })
    .catch(function(err){
      clearTimeout(to);
      console.warn('Relais BD TOPO (IGN) en échec:', err);
      onFail();
    });
  }

  function classifyRoad(tags){
    var ref = (tags.ref || '').trim();
    if(/^D\s?\d/i.test(ref)) return 'RD';
    if(/^N\s?\d/i.test(ref)) return 'RN';
    if(tags.highway === 'trunk' || tags.highway === 'motorway') return 'RN';
    if(tags.highway === 'track' || tags.highway === 'bridleway') return 'PATH';
    return 'RC';
  }
  // Clé stable, indépendante de la classification (nécessaire pour pouvoir
  // reclasser une route sans perdre son historique).
  function roadKeyFor(tags, elId){
    if(tags.name) return tags.name;
    if(tags.ref) return tags.ref;
    return 'way' + elId;
  }
  function legacyKeySuffix(key){
    return key.replace(/^(RC|RD|RN|PATH)::/, '');
  }

  var roadsIndex = {}; // key -> { key, label, roadClass, originalClass }
  var roadCoverage = {}; // key -> { covered, by, at, customName, customClass, hidden }
  var roadCoverageSha = null;
  var currentRole = localStorage.getItem('ambroisie_role');

  // Recolle les tronçons d'une même route qui se touchent (même logique que
  // pour le contour communal), avec une tolérance de ~2m pour absorber les
  // petites imprécisions entre tronçons BD TOPO adjacents à une intersection
  // — indispensable pour qu'une route reste visuellement en un seul morceau.
  function stitchSegmentsLoose(segments){
    var segs = segments.map(function(s){ return s.slice(); });
    var rings = [];
    function eq(a, b){ return Math.abs(a[0]-b[0]) < 0.00002 && Math.abs(a[1]-b[1]) < 0.00002; }
    while(segs.length){
      var ring = segs.shift();
      var changed = true;
      while(changed){
        changed = false;
        for(var i = 0; i < segs.length; i++){
          var s = segs[i];
          var ringStart = ring[0], ringEnd = ring[ring.length-1];
          var sStart = s[0], sEnd = s[s.length-1];
          if(eq(ringEnd, sStart)){ ring = ring.concat(s.slice(1)); segs.splice(i,1); changed = true; break; }
          else if(eq(ringEnd, sEnd)){ ring = ring.concat(s.slice().reverse().slice(1)); segs.splice(i,1); changed = true; break; }
          else if(eq(ringStart, sEnd)){ ring = s.slice(0,-1).concat(ring); segs.splice(i,1); changed = true; break; }
          else if(eq(ringStart, sStart)){ ring = s.slice().reverse().slice(0,-1).concat(ring); segs.splice(i,1); changed = true; break; }
        }
      }
      rings.push(ring);
    }
    return rings;
  }

  function buildRoadsIndex(osmData){
    var grouped = {};
    (osmData.elements || []).forEach(function(el){
      if(el.type !== 'way' || !el.geometry) return;
      var tags = el.tags || {};
      var key = roadKeyFor(tags, el.id);
      if(!grouped[key]){
        grouped[key] = {
          roadClass: classifyRoad(tags),
          label: tags.name ? tags.name : ('Voie (' + (tags.highway || '?') + ')'),
          rawLines: []
        };
      }
      grouped[key].rawLines.push(el.geometry.map(function(pt){ return [pt.lat, pt.lon]; }));
    });
    roadsIndex = {};
    Object.keys(grouped).forEach(function(key){
      var g = grouped[key];
      roadsIndex[key] = {
        key: key, label: g.label, roadClass: g.roadClass, originalClass: g.roadClass,
        latlngsList: stitchSegmentsLoose(g.rawLines)
      };
    });
    applyRoadClassOverrides();
    syncGeometryToCloud();
  }

  // Mémorise durablement la forme des routes récupérées, pour ne plus avoir
  // à recontacter la BD TOPO à chaque ouverture de cette page.
  // Réduit la précision des coordonnées à 5 décimales (~1m) et retire les
  // doublons consécutifs — l'API GitHub refuse de lire un fichier de plus de
  // 1 Mo, vite dépassé en pleine précision avec beaucoup de routes.
  function roundGeometry(node){
    if(!Array.isArray(node)) return node;
    if(node.length === 2 && typeof node[0] === 'number' && typeof node[1] === 'number'){
      return [Math.round(node[0] * 1e5) / 1e5, Math.round(node[1] * 1e5) / 1e5];
    }
    var mapped = node.map(roundGeometry);
    if(mapped.length && Array.isArray(mapped[0]) && typeof mapped[0][0] === 'number'){
      var deduped = [];
      mapped.forEach(function(p){
        var last = deduped[deduped.length - 1];
        if(!last || last[0] !== p[0] || last[1] !== p[1]) deduped.push(p);
      });
      return deduped;
    }
    return mapped;
  }

  function syncGeometryToCloud(){
    var changed = false;
    Object.keys(roadsIndex).forEach(function(key){
      var entry = roadsIndex[key];
      if(!entry.latlngsList) return;
      var cov = roadCoverage[key];
      if(!cov){ cov = {}; roadCoverage[key] = cov; }
      var roundedGeom = roundGeometry(entry.latlngsList);
      if(!cov.latlngsList || JSON.stringify(cov.latlngsList) !== JSON.stringify(roundedGeom) || cov.originalClass !== entry.originalClass){
        cov.latlngsList = roundedGeom;
        cov.label = entry.label;
        cov.source = cov.source || 'osm';
        cov.originalClass = entry.originalClass;
        changed = true;
      }
    });
    if(changed) saveRoadCoverage().catch(function(){ /* on retentera plus tard */ });
  }

  // Applique les reclassifications manuelles mémorisées (RC ↔ RD ↔ RN ↔ PATH)
  // et retient les routes masquées.
  function applyRoadClassOverrides(){
    Object.keys(roadsIndex).forEach(function(key){
      var entry = roadsIndex[key];
      var override = roadCoverage[key];
      entry.roadClass = (override && override.customClass) ? override.customClass : entry.originalClass;
    });
  }

  function loadRoadsFromOsm(){
    document.getElementById('loadStatus').style.display = 'block';
    document.getElementById('loadStatus').textContent = 'Chargement des routes (BD TOPO)…';
    document.getElementById('mainTable').style.display = 'none';

    fetchFromBdTopo(BBOX, function(data){
      buildRoadsIndex(data);
      afterRoadsLoaded();
    }, function(){
      document.getElementById('loadStatus').textContent = '⚠️ Impossible de contacter la BD TOPO (IGN). Réessayez dans quelques minutes.';
    }, 15000);
  }

  async function afterRoadsLoaded(){
    await loadRoadCoverage();
    applyRoadClassOverrides();
    document.getElementById('loadStatus').style.display = 'none';
    document.getElementById('mainTable').style.display = 'table';
    renderTable();
  }

  function roadCoverageApiUrl(){ return CONFIG.WORKER_URL.replace('/signalements', '/road-coverage'); }

  async function loadRoadCoverage(){
    try{
      var resp = await fetch(roadCoverageApiUrl(), { method: 'GET', headers: authHeaders() });
      if(resp.status === 401){ document.getElementById('loginGate').classList.remove('hidden'); return; }
      var data = await resp.json();
      roadCoverageSha = data.sha || null;
      roadCoverage = {};
      (data.items || []).forEach(function(item){
        var key = legacyKeySuffix(item.key); // migration des anciennes clés "RC::Nom" -> "Nom"
        roadCoverage[key] = {
          covered: item.covered !== undefined ? item.covered : true,
          by: item.by, at: item.at,
          customName: item.customName || null,
          customClass: item.customClass || null,
          hidden: !!item.hidden,
          reviewed: !!item.reviewed,
          latlngsList: item.latlngsList || null,
          label: item.label || null,
          source: item.source || 'osm',
          originalClass: item.originalClass || null
        };
      });
    } catch(e){ console.warn('Erreur chargement couverture des routes', e); }
  }

  async function saveRoadCoverage(){
    var items = Object.keys(roadCoverage).map(function(key){
      var e = roadCoverage[key];
      return {
        key: key, covered: !!e.covered, by: e.by, at: e.at,
        customName: e.customName || null, customClass: e.customClass || null, hidden: !!e.hidden, reviewed: !!e.reviewed,
        latlngsList: e.latlngsList || null, label: e.label || null, source: e.source || 'osm', originalClass: e.originalClass || null
      };
    });
    var resp = await fetch(roadCoverageApiUrl(), {
      method: 'PUT',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ items: items, sha: roadCoverageSha })
    });
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    var data = await resp.json();
    roadCoverageSha = data.sha;
  }

  function isRoadCovered(key){ return !!(roadCoverage[key] && roadCoverage[key].covered); }
  function isRoadHidden(key){ return !!(roadCoverage[key] && roadCoverage[key].hidden); }
  function roadDisplayLabel(entry){
    var custom = roadCoverage[entry.key] && roadCoverage[entry.key].customName;
    return custom || entry.label;
  }

  function renderTable(){
    var q = document.getElementById('fSearch').value.trim().toLowerCase();
    var fClass = document.getElementById('fClass').value;
    var fStatus = document.getElementById('fStatus').value;
    var fNamed = document.getElementById('fNamed').value;
    var fHidden = document.getElementById('fHidden').value;

    var entries = Object.keys(roadsIndex).map(function(k){ return roadsIndex[k]; });

    entries = entries.filter(function(e){
      var hidden = isRoadHidden(e.key);
      if(fHidden === 'non' && hidden) return false;
      if(fHidden === 'oui' && !hidden) return false;
      if(fClass && e.roadClass !== fClass) return false;
      var covered = isRoadCovered(e.key);
      if(fStatus === 'oui' && !covered) return false;
      if(fStatus === 'non' && covered) return false;
      var isNamed = !e.label.startsWith('Voie (') || !!(roadCoverage[e.key] && roadCoverage[e.key].customName);
      if(fNamed === 'named' && !isNamed) return false;
      if(fNamed === 'unnamed' && isNamed) return false;
      if(q && roadDisplayLabel(e).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    entries.sort(function(a,b){ return roadDisplayLabel(a).localeCompare(roadDisplayLabel(b), 'fr'); });

    document.getElementById('resultCount').textContent = entries.length + ' route(s) sur ' + Object.keys(roadsIndex).length;

    var classColors = { RC:'#2f6b3a', RD:'#c9781f', RN:'#8a3fbf', PATH:'#8a8a8a' };
    var classLabels = { RC:'Communale', RD:'Départementale', RN:'Nationale', PATH:'Privé' };
    var isAdmin = currentRole === 'admin';

    var tbody = document.getElementById('tableBody');
    tbody.innerHTML = entries.map(function(e){
      var covered = isRoadCovered(e.key);
      var hidden = isRoadHidden(e.key);
      var info = roadCoverage[e.key];
      var displayName = roadDisplayLabel(e);

      var classCell;
      if(isAdmin){
        classCell = '<select class="classSelect" data-key="' + escapeHtml(e.key) + '">' +
          Object.keys(classLabels).map(function(c){
            return '<option value="' + c + '"' + (c === e.roadClass ? ' selected' : '') + '>' + classLabels[c] + '</option>';
          }).join('') +
        '</select>';
      } else {
        classCell = '<span class="pill" style="background:' + classColors[e.roadClass] + '22;color:' + classColors[e.roadClass] + ';">' + classLabels[e.roadClass] + '</span>';
      }

      return '<tr data-key="' + escapeHtml(e.key) + '"' + (hidden ? ' style="opacity:.5;"' : '') + '>' +
        '<td><div class="nameCell">' +
          '<input type="text" class="nameInput" value="' + escapeHtml(displayName) + '"' + (isAdmin ? '' : ' disabled') + '>' +
          (isAdmin ? '<button class="saveNameBtn" disabled>Enregistrer</button>' : '') +
        '</div></td>' +
        '<td>' + classCell + '</td>' +
        '<td>' + (covered ? '✅ Parcourue' : '—') + (hidden ? ' <span style="color:var(--danger);font-size:11px;">(masquée)</span>' : '') + '</td>' +
        '<td style="font-size:11px;color:var(--muted);">' + (info && covered ? escapeHtml(info.by||'') + '<br>' + (info.at ? new Date(info.at).toLocaleDateString('fr-FR') : '') : '—') + '</td>' +
        '<td><button class="toggleBtn ' + (covered?'done':'') + '" data-toggle="' + escapeHtml(e.key) + '">' + (covered ? 'Remettre non parcourue' : 'Marquer parcourue') + '</button></td>' +
        '<td>' + (isAdmin ? '<button class="toggleBtn" data-hide="' + escapeHtml(e.key) + '">' + (hidden ? '👁️ Afficher' : '🗑️ Masquer') + '</button>' : '—') + '</td>' +
      '</tr>';
    }).join('');

    tbody.querySelectorAll('tr').forEach(function(tr){
      var key = tr.getAttribute('data-key');
      var input = tr.querySelector('.nameInput');
      var saveBtn = tr.querySelector('.saveNameBtn');
      if(input && saveBtn){
        input.addEventListener('input', function(){ saveBtn.disabled = false; });
        saveBtn.addEventListener('click', async function(){
          var newName = input.value.trim();
          if(!newName){ showToast('Le nom ne peut pas être vide.'); return; }
          var e = roadCoverage[key] || { covered: false };
          e.customName = newName;
          roadCoverage[key] = e;
          saveBtn.disabled = true;
          saveBtn.textContent = '…';
          try{
            await saveRoadCoverage();
            showToast('✓ Nom enregistré.');
            renderTable();
          } catch(err){
            showToast('Erreur lors de l\'enregistrement.');
            saveBtn.disabled = false;
            saveBtn.textContent = 'Enregistrer';
          }
        });
      }
    });

    tbody.querySelectorAll('.classSelect').forEach(function(sel){
      sel.addEventListener('change', async function(){
        var key = sel.getAttribute('data-key');
        var entry = roadsIndex[key];
        var newClass = sel.value;
        var e = roadCoverage[key] || { covered: false };
        // Si on remet la classe d'origine (celle d'OSM), on retire la
        // correction plutôt que de garder une correction inutile.
        e.customClass = (newClass === entry.originalClass) ? null : newClass;
        roadCoverage[key] = e;
        applyRoadClassOverrides();
        sel.disabled = true;
        try{
          await saveRoadCoverage();
          showToast('✓ Classification mise à jour.');
          renderTable();
        } catch(err){
          showToast('Erreur lors de l\'enregistrement.');
          sel.disabled = false;
        }
      });
    });

    tbody.querySelectorAll('[data-toggle]').forEach(function(btn){
      btn.addEventListener('click', async function(){
        var key = btn.getAttribute('data-toggle');
        var e = roadCoverage[key] || { customName: null };
        e.covered = !e.covered;
        e.by = currentUser;
        e.at = new Date().toISOString();
        roadCoverage[key] = e;
        btn.disabled = true;
        try{
          await saveRoadCoverage();
          renderTable();
        } catch(err){
          showToast('Erreur lors de l\'enregistrement.');
          btn.disabled = false;
        }
      });
    });

    tbody.querySelectorAll('[data-hide]').forEach(function(btn){
      btn.addEventListener('click', async function(){
        var key = btn.getAttribute('data-hide');
        var entry = roadsIndex[key];
        var e = roadCoverage[key] || { covered: false };
        var willHide = !e.hidden;
        if(willHide && !confirm('Masquer "' + roadDisplayLabel(entry) + '" ? Elle disparaîtra de la carte principale et du suivi des routes.')) return;
        e.hidden = willHide;
        roadCoverage[key] = e;
        btn.disabled = true;
        try{
          await saveRoadCoverage();
          showToast(willHide ? '✓ Route masquée.' : '✓ Route réaffichée.');
          renderTable();
        } catch(err){
          showToast('Erreur lors de l\'enregistrement.');
          btn.disabled = false;
        }
      });
    });
  }

  ['fSearch','fClass','fStatus','fNamed','fHidden'].forEach(function(id){
    var el = document.getElementById(id);
    el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', renderTable);
  });

  document.getElementById('btnReload').addEventListener('click', loadRoadsFromOsm);

  // Reconstruit roadsIndex directement depuis la géométrie mémorisée sur
  // GitHub (road-coverage.json) — pas besoin de recontacter OpenStreetMap au
  // quotidien une fois que les routes ont été chargées au moins une fois.
  function rebuildFromCache(){
    var found = false;
    roadsIndex = {};
    Object.keys(roadCoverage).forEach(function(key){
      var cov = roadCoverage[key];
      if(!cov.latlngsList || !cov.latlngsList.length) return;
      found = true;
      var originalClass = cov.source === 'manual' ? (cov.customClass || 'RC') : (cov.originalClass || 'RC');
      roadsIndex[key] = {
        key: key, label: cov.label || cov.customName || key,
        roadClass: cov.customClass || originalClass, originalClass: originalClass
      };
    });
    return found;
  }

  async function boot(){
    await loadRoadCoverage();
    if(rebuildFromCache()){
      applyRoadClassOverrides();
      document.getElementById('loadStatus').classList.add('hidden');
      document.getElementById('mainTable').style.display = 'table';
      renderTable();
    } else {
      // Rien en mémoire encore : premier chargement, on passe par OpenStreetMap.
      loadRoadsFromOsm();
    }
  }

  if(sessionToken && currentUser) boot();
})();
</script>
</body>
</html>
